apiVersion: apps/v1
kind: Deployment
metadata:
  name: bewirtung-api
  namespace: bewirtung
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bewirtung-api
  template:
    metadata:
      labels:
        app: bewirtung-api
    spec:
      containers:
        - name: bewirtung-api
          image: kechg/bewirtung-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5080
          env:
            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:5080"
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: bewirtung-db
                  key: ConnectionStrings__Postgres
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: bewirtung-api
  namespace: bewirtung
spec:
  type: NodePort
  selector:
    app: bewirtung-api
  ports:
    - name: http
      port: 5080
      targetPort: 5080
      nodePort: 30580

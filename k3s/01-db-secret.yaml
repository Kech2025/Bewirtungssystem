# Verbindungsdaten zur PostgreSQL im Cluster.
# Passwort ggf. anpassen.
#
# HOCHVERFÜGBARKEIT (CloudNativePG):
# Der Host zeigt auf den read/write-Service des CNPG-Clusters, der immer dem
# aktuellen Primary folgt. Nach einem Failover findet die App automatisch den
# neuen Primary. Siehe k3s/db/README.md.
#
# Alter Einzel-Host (Bitnami, vor der Migration):
#   Host=postgres-external.database.svc.cluster.local
apiVersion: v1
kind: Secret
metadata:
  name: bewirtung-db
  namespace: bewirtung
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=bewirtung-pg-rw.database.svc.cluster.local;Port=5432;Database=bewirtung;Username=postgres;Password=Kiwo2014"

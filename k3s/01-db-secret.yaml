# Verbindungsdaten zur PostgreSQL im Cluster.
# Passwort ggf. anpassen. Der Host verweist per cross-namespace-DNS
# auf den Service "postgres-external" im Namespace "database".
apiVersion: v1
kind: Secret
metadata:
  name: bewirtung-db
  namespace: bewirtung
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=postgres-external.database.svc.cluster.local;Port=5432;Database=bewirtung;Username=postgres;Password=Kiwo2014"

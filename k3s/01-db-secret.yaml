# Verbindungsdaten zur PostgreSQL im Cluster.
# Passwort ggf. anpassen. Der Host verweist per cross-namespace-DNS
# auf den Service "postgres-external" im Namespace "database".
#
# HOCHVERFÜGBARKEIT (CloudNativePG):
# Nach der Migration auf den CNPG-Cluster (siehe k3s/db/README.md) muss der
# Host auf den read/write-Service gesetzt werden, der immer dem Primary folgt:
#   Host=bewirtung-pg-rw.database.svc.cluster.local
# Dann diese Datei erneut anwenden und API + Webserver neu ausrollen.
apiVersion: v1
kind: Secret
metadata:
  name: bewirtung-db
  namespace: bewirtung
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=postgres-external.database.svc.cluster.local;Port=5432;Database=bewirtung;Username=postgres;Password=Kiwo2014"

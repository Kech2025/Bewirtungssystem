apiVersion: v1
kind: ServiceAccount
metadata:
  name: bewirtung-webserver
  namespace: bewirtung
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bewirtung-webserver-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bewirtung-webserver-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bewirtung-webserver-node-reader
subjects:
  - kind: ServiceAccount
    name: bewirtung-webserver
    namespace: bewirtung
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bewirtung-webserver
  namespace: bewirtung
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bewirtung-webserver
  template:
    metadata:
      labels:
        app: bewirtung-webserver
    spec:
      # ServiceAccount mit Leserecht auf Nodes (für die Cluster-LED-Anzeige im Journal).
      serviceAccountName: bewirtung-webserver
      # Der Pod läuft auf einem Node mit USB-Stick unter /media/usb.
      # Für Hochverfügbarkeit mehrere Nodes labeln (z. B. pi-1 UND pi-2):
      #   kubectl label node pi-1 usb-stick=true
      #   kubectl label node pi-2 usb-stick=true
      # Fällt der aktive Node aus, startet der Pod automatisch auf dem anderen
      # gelabelten Node. Hinweis: Der DSFinV-K-USB-Export wird dann auf den Stick
      # des jeweils aktiven Nodes geschrieben -> beide Sticks archivieren.
      # replicas bleibt 1, da nur eine Instanz auf den lokalen Stick schreiben darf.
      nodeSelector:
        usb-stick: "true"
      containers:
        - name: bewirtung-webserver
          image: kechg/bewirtung-webserver:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:8080"
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: bewirtung-db
                  key: ConnectionStrings__Postgres
            # Zielpfad des serverseitigen DSFinV-K-USB-Exports
            - name: Export__UsbZielPfad
              value: "/media/usb"
            # Stirling-PDF (DOCX -> PDF): Dienst-URL und API-Key
            - name: StirlingPdf__BaseUrl
              value: "http://stirling-pdf-service.stirling-pdf.svc.cluster.local:8080"
            - name: StirlingPdf__ApiKey
              valueFrom:
                secretKeyRef:
                  name: bewirtung-stirling
                  key: StirlingPdf__ApiKey
            - name: CloudTse__MasterKey
              valueFrom:
                secretKeyRef:
                  name: bewirtung-fiskaly
                  key: CloudTse__MasterKey
                  optional: true
          volumeMounts:
            - name: usb-stick
              mountPath: /media/usb
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: usb-stick
          hostPath:
            path: /media/usb      # Mountpunkt des USB-Sticks auf dem Node
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: bewirtung-webserver
  namespace: bewirtung
spec:
  type: NodePort
  selector:
    app: bewirtung-webserver
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080

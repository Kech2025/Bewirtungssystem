services:
  api:
    build:
      context: .
      dockerfile: Bewirtung.Api/Dockerfile
    environment:
      # Verbindung zur BESTEHENDEN Datenbank (Container "postgres_db").
      # Standard: über das Host-Gateway auf den vom DB-Container veröffentlichten Port 5432.
      # Bei Bedarf komplett über BEWIRTUNG_DB_CONNECTION in der .env überschreiben.
      ConnectionStrings__Postgres: "${BEWIRTUNG_DB_CONNECTION:-Host=host.docker.internal;Port=5432;Database=bewirtung;Username=postgres;Password=postgres}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5080:5080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Bewirtung.Webserver/Dockerfile
    environment:
      ConnectionStrings__Postgres: "${BEWIRTUNG_DB_CONNECTION:-Host=host.docker.internal;Port=5432;Database=bewirtung;Username=postgres;Password=postgres}"
      # URL des Stirling-PDF-Dienstes (DOCX -> PDF).
      # Standard: interner Container "stirling-pdf" auf Port 8080 (Docker-Netzwerk).
      StirlingPdf__BaseUrl: "${STIRLING_PDF_BASEURL:-http://stirling-pdf:8080}"
      # API-Key, falls Stirling-PDF mit Authentifizierung läuft (sonst leer lassen).
      StirlingPdf__ApiKey: "${STIRLING_PDF_APIKEY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - stirling-pdf
    ports:
      # Host-Port der Weboberfläche konfigurierbar (Standard 8080), um Konflikte
      # mit anderen Diensten auf 8080 zu vermeiden. Container-intern bleibt 8080.
      - "${WEB_HOST_PORT:-8080}:8080"
    restart: unless-stopped

  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    environment:
      # Keine Authentifizierung im Standardbetrieb. Bei Bedarf API-Key aktivieren.
      DISABLE_ADDITIONAL_FEATURES: "true"
    ports:
      # Host-Port 8081, um Konflikt mit der Weboberflaeche (8080) zu vermeiden.
      # Container-intern bleibt 8080, darueber erreicht der web-Service den Dienst.
      - "${STIRLING_PDF_HOST_PORT:-8081}:8080"
    restart: unless-stopped
